name: Deploy MultiDocker
on:
  push:
    branches:
      - main # check your repo, your default branch might be master!

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker login -u ${{ secrets.DOCKER_USERNAME }} -p ${{ secrets.DOCKER_PASSWORD }}
      - run: docker build -t kithung56/react-test -f ./client/Dockerfile.dev ./client
      - run: docker run -e CI=true kithung56/react-test npm test

      - run: docker build -t kithung56/multi-client-up ./client
      - run: docker build -t kithung56/multi-nginx-up ./nginx
      - run: docker build -t kithung56/multi-server-up ./server
      - run: docker build -t kithung56/multi-worker-up ./worker

      - run: docker push kithung56/multi-client-up
      - run: docker push kithung56/multi-nginx-up
      - run: docker push kithung56/multi-server-up
      - run: docker push kithung56/multi-worker-up

      - name: Generate deployment package
        run: zip -r deploy.zip . -x '*.git*'
